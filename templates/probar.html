<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adivina tu dibujo · Compuertas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% include "encabezado.html" %}

  <main class="contenido">
    <h1>Adivina tu dibujo</h1>
    <p class="etiqueta">Dibuja cualquier compuerta y pulsa Predecir, o sube una foto o imagen de una, y la red neuronal dirá cuál es.</p>

    <div class="zona zona-probar">
      <section class="dibujo" aria-label="Lienzo">
        <canvas id="lienzo" width="{{ tam }}" height="{{ tam }}" aria-label="Lienzo de dibujo"></canvas>
        <div class="botones">
          <button type="button" id="deshacer">Deshacer</button>
          <button type="button" id="borrar">Borrar</button>
          <button type="button" id="subir">Subir imagen</button>
          <input type="file" id="archivo" accept="image/*" hidden>
          <button type="button" id="predecir" class="principal" disabled>Predecir</button>
        </div>
      </section>

      <section class="referencia resultado" aria-label="Predicción" aria-live="polite">
        <p class="etiqueta">Predicción</p>
        <p id="ganadora" class="ganadora">…</p>
        <ul id="probabilidades" class="probabilidades"></ul>
      </section>
    </div>

    <footer class="pie">
      <a href="{{ url_for('main') }}">Recolectar dibujos</a>
    </footer>
  </main>

  <script>
    const COMPUERTAS = {{ compuertas|tojson }};
  </script>
  <script src="{{ url_for('static', filename='probar.js') }}"></script>
</body>
</html>
